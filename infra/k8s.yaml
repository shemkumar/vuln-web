apiVersion: v1
kind: Pod
metadata:
  name: vuln-app
spec:
  hostNetwork: true
  containers:
    - name: app
      image: vuln-app:latest
      imagePullPolicy: Always
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
      env:
        - name: JWT_SECRET
          value: dev-secret-12345
      ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-app-service
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
  selector:
    app: vuln-app
